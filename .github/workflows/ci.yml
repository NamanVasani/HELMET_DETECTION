name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Python dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Python tests
        run: python -B -m unittest test_adaptive_zoom test_capture_state test_evaluation test_service test_event_store test_dashboard test_server_features test_manage test_alerts_cameras
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser tests
        run: npm ci && node test_camera_page.js
