name: Landing page

# Publishes site/ (the product landing page) to GitHub Pages on every push to main that touches it.
on:
  push:
    branches: [main]
    paths: ["site/**", "static/icon.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the static site
        run: |
          mkdir -p _site/static
          cp -R site/. _site/
          cp static/icon.svg _site/static/icon.svg
          # The page sits one level higher on Pages than in the repo.
          sed -i 's#\.\./static/#static/#g' _site/index.html
          test -f _site/media/helmet-demo.webm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
